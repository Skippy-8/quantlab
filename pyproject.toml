[project]
name = "quantlab"
version = "0.1.0"
description = "Backtests that can't lie to you: a realistic execution engine, overfitting controls that count every attempt, a Parquet/DuckDB data lake, a Streamlit research dashboard and a real-time Node.js console."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sneh Patel" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15",
    "duckdb>=1.0",
    "requests>=2.31",
    "pytz>=2024.1",
    "plotly>=5.20",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.45"]
equities = ["yfinance>=0.2.40"]
dev = ["pytest>=8", "ruff>=0.5"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5", "mkdocstrings[python]>=0.26"]

[project.scripts]
quantlab = "quantlab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["quantlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["quantlab"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["quantlab.engine.EngineConfig", "EngineConfig", "quantlab.portfolio.Sizing", "Sizing",
                          "quantlab.engine.ExitRules", "ExitRules"]
