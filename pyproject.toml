[project]
name = "quantlab"
version = "0.1.0"
description = "A research platform for honest backtests: a standardized scoring engine, multiple-testing controls, a sealed out-of-sample vault, a Parquet/DuckDB data lake and a Streamlit dashboard."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sneh Patel" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15",
    "duckdb>=1.0",
    "requests>=2.31",
    "pytz>=2024.1",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.35", "plotly>=5.20"]
equities = ["yfinance>=0.2.40"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
quantlab = "quantlab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["quantlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["quantlab.engine.EngineConfig", "EngineConfig"]
